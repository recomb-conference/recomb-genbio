<script type="application/ld+json">
{% if site.baseurl contains '://' %}{% assign baseUrl = site.baseurl %}{% else %}{% assign baseUrl = site.baseurl | prepend: site.url %}{% endif %}
{% assign eventImage = site.socialImageSrcGooglePlus | default: site.socialImageSrcFacebook | default: site.socialImageSrcTwitter %}
    [{
        "@context" : "https://schema.org",
        "@type" : "Event",
        "name" : {{ site.title | jsonify }},
        "description": {{ site.description | jsonify }},
        {% if eventImage %}"image" : "{{ eventImage | prepend: baseUrl }}",{% endif %}
        "url" : "{{ site.url }}",
        "startDate" : "{{ site.eventStartTime }}",
        "doorTime" : "{{ site.eventDoorTime }}",
        "endDate" : "{{ site.eventEndTime }}",
        "location" : {
            "@type" : "Place",
            "name" : {{ site.eventLocationName | jsonify }},
            "sameAs" : "{{ site.eventLocationLink }}",
            "address" : {
                "@type" : "PostalAddress",
                "streetAddress" : {{ site.eventStreetAddress | jsonify }},
                "addressLocality" : {{ site.eventAddressLocality | jsonify }},
                "addressRegion" : {{ site.eventAddressLocalityRegion | jsonify }},
                "postalCode" : {{ site.eventPostalCode | jsonify }},
                "addressCountry" : {{ site.eventAddressCountry | jsonify }}
            },
            "geo" : {
                "@type" : "GeoCoordinates",
                {% assign coordinates = site.eventPlaceCoordinates | split:"," %}
                "latitude" : "{{ coordinates[0] }}",
                "longitude" : "{{ coordinates[1] }}"
            }
        },
        {% if site.organizerName %}
        "organizer" : {
            "@type" : "Organization",
            "name" : {{ site.organizerName | jsonify }},
            "alternateName" : {{ site.organizerAlternateName | jsonify }},
            "description" : {{ site.organizerDescription | jsonify }},
            "logo" : "{{ site.organizerLogo | prepend: baseUrl }}",
            "email" : "{{ site.organizerEmail }}",
            "sameAs" : "{{ site.organizerLink }}"
        },
        {% endif %}
        {% if site.hackathonTitle %}
        "subEvent" : {
            "@type" : "Event",
            "name" : {{ site.hackathonTitle | jsonify }},
            "description": {{ site.hackathonRows[0].details | jsonify }},
            {% if eventImage %}"image" : "{{ eventImage | prepend: baseUrl }}",{% endif %}
            "url" : "{{ baseUrl }}/hackathon/",
            "startDate" : "{{ site.hackathonStartTime }}",
            "doorTime" : "{{ site.hackathonDoorTime }}",
            "endDate" : "{{ site.hackathonEndTime }}",
            "location" : {
                "@type" : "Place",
                "name" : {{ site.hackathonLocationName | jsonify }},
                "sameAs" : "{{ site.hackathonLocationLink }}",
                "address" : {
                    "@type" : "PostalAddress",
                    "streetAddress" : {{ site.hackathonStreetAddress | jsonify }},
                    "addressLocality" : {{ site.hackathonAddressLocality | jsonify }},
                    "addressRegion" : {{ site.hackathonAddressLocalityRegion | jsonify }},
                    "postalCode" : {{ site.hackathonPostalCode | jsonify }},
                    "addressCountry" : {{ site.hackathonAddressCountry | jsonify }}
                },
                "geo" : {
                    "@type" : "GeoCoordinates",
                    {% assign hackathonCoordinates = site.hackathonPlaceCoordinates | split:"," %}
                    "latitude" : "{{ hackathonCoordinates[0] }}",
                    "longitude" : "{{ hackathonCoordinates[1] }}"
                }
            }
        },
        {% endif %}
        {% if site.ticketsOffers %}
        "offers" : [
        {% for ticketsOffer in site.ticketsOffers %}
        {
            "@type" : "Offer",
            "name" : {{ ticketsOffer.name | jsonify }},
            "url" : "{{ ticketsOffer.buyButtonLink }}",
            "price" : "{{ ticketsOffer.price }}",
            "priceCurrency" : "{{ ticketsOffer.priceCurrency }}",
            "validFrom" : "{{ ticketsOffer.validFrom }}",
            "validThrough" : "{{ ticketsOffer.validThrough }}"
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
        ],
        {% endif %}
        {% if site.data.speakers %}
        "performer" : [
        {% for speaker in site.data.speakers %}
        {
            "@type" : "Person",
            "name" : {{ speaker.name | append: ' ' | append: speaker.surname | jsonify }},
            "image" : "{{ baseUrl | append: '/img/people/' | append: speaker.thumbnailUrl }}",
            "jobTitle" : {{ speaker.title | jsonify }},
            "worksFor" : {
                "@type" : "Organization",
                "name" : {{ speaker.company | jsonify }}
            },
            "sameAs" : "{{ speaker.social[0].link }}"
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
        ],
        {% endif %}
        "eventStatus" : "https://schema.org/EventScheduled",
        "typicalAgeRange" : "16+"
    }]
</script>
